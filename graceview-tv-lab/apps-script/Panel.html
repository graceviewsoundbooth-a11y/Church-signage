<!doctype html>
<html>
<head>
<base target="_top">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap">
<style>
/* Control panel: phone-first single column, cards for TVs, tables for schedule rows. */
:root{
  --bg:#F5F3F2;--surface:#FFFFFF;--sunk:#EEEAE8;--line:#DED7D4;--fg:#1C1A1A;--muted:#6A625F;
  --brand:#B50606;--brand-fg:#FFFFFF;--ok:#1E7B4F;--warn:#9A5B00;--bad:#B42318;--info:#4B3FA8;
  --head:Montserrat,'Segoe UI',Arial,sans-serif;--body:'Source Sans 3','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151314;--surface:#1E1B1C;--sunk:#272324;--line:#3A3435;--fg:#F1ECEB;--muted:#A79E9B;
  --brand:#EF5350;--brand-fg:#1B0505;--ok:#4CC38A;--warn:#E3A13B;--bad:#F07167;--info:#A99CF5;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body)}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance}
h2{font-size:22px}h3{font-size:17px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,env(safe-area-inset-right));padding-left:max(16px,env(safe-area-inset-left));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .mk{width:34px;height:34px;border-radius:50%;border:3px solid var(--brand);display:grid;place-items:center;font:700 16px var(--head);color:var(--brand)}
.brand h1{font-size:18px}
.lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--info);border:1px solid currentColor;border-radius:999px;padding:1px 8px}
.who{font-size:14px;color:var(--muted);text-align:right}
.who b{color:var(--fg)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-left));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--sunk);color:var(--fg)}
main{max-width:1240px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;min-width:0}
input[type=text],input[type=date],input[type=time],input[type=url],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:90px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;letter-spacing:.02em;background:var(--sunk);white-space:nowrap}
.chip.Override{background:var(--bad);color:#fff}
.chip.Special{background:var(--info);color:#fff}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer}
.tog.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.timebar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.timebar .now{font-weight:600}
.timebar .now.pv{color:var(--info)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.tvbox{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:#000}
.card .cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .why{margin:0;font-size:14px}
.card .meta{margin:0;font-size:13px;color:var(--muted)}
.card .acts{margin-top:auto;padding-top:6px;display:flex;gap:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.ok{background:var(--ok)}
.banner{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.warnbox{border-left:4px solid var(--warn);padding:10px 14px;background:var(--sunk);border-radius:6px;font-size:15px}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
@media (max-width:860px){.twocol{grid-template-columns:1fr}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.off td{opacity:.5}
tr.flag td:first-child{box-shadow:inset 4px 0 var(--warn)}
.week{display:grid;grid-template-columns:44px repeat(7,minmax(90px,1fr));min-width:760px;position:relative}
.week .dh{font:700 13px var(--head);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.week .hrs{position:relative}
.week .hrs span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-50%)}
.week .col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--line) 35px,var(--line) 36px)}
.blk{position:absolute;border-radius:6px;padding:3px 5px;font-size:11px;line-height:1.2;color:#fff;overflow:hidden;cursor:pointer;border:1px solid rgba(0,0,0,.25)}
.blk.hid{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px)}
.blk b{display:block;font-size:11px}
.themes-list{display:flex;flex-direction:column;gap:8px}
.themes-list button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left}
.themes-list button.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.sw{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.2);flex:none}
.colorrow{display:flex;gap:8px;align-items:center}
.colorrow input[type=color]{width:44px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
.slide{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;padding:12px;border:1px solid var(--line);border-radius:10px}
@media (max-width:600px){.slide{grid-template-columns:1fr}}
.cpairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cpair{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;min-width:0}
.cpair-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.swatch{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;border:1px solid rgba(0,0,0,.15)}
.swatch .big{font-size:28px;font-weight:300;line-height:1.1}
.swatch.bad{background:var(--sunk);color:var(--bad)}
.gate{max-width:560px;margin:24px auto 0}
.linkbox{border:2px solid var(--ok);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tog input{margin:0}
.lnTiles{display:flex;flex-direction:column;gap:8px}
.lnTile{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.calRow{display:flex;flex-direction:column;gap:6px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--sunk);position:relative}
.drop.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--sunk))}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.vtag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;border-radius:8px;background:var(--sunk)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;display:none;max-width:90vw;z-index:20}
#toast.bad{background:var(--bad);color:#fff}
#busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--brand);transform:scaleX(0);transform-origin:left;transition:transform .4s}
#busy.on{transform:scaleX(.8)}
@media (prefers-reduced-motion:reduce){#busy{transition:none}}
</style>
</head>
<body>
<div id="busy"></div>
<header class="top">
  <div class="brand"><div class="mk">G</div><h1>Graceview TV</h1><span class="lab">Lab</span></div>
  <div class="who" id="who">Loading…</div>
</header>
<nav id="nav" aria-label="Sections"></nav>
<main id="main"><div class="panel">Loading the Sheet…</div></main>
<div id="toast" role="status"></div>
<script id="params" type="application/json"><?!= params ?></script>
<?!= include('Screen') ?>
<script>
var S=null, view='now', preview='', edit=null, pendingDelete=null, schedFilter='all';
var themeForm=null, slideTheme=null, ov=null, ovConfirm=false;
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var VIEWS=[['now','Now',null],['devices','Devices',null],['override','Override','override'],['schedule','Schedule','schedule'],['themes','Themes','theme'],['slides','Slides','slides'],
  ['activity','Activity','activity'],['launchers','Launchers','launchers'],['greenroom','Green Room','greenroom'],['people','People','users'],['church','Church','users'],['account','Account',null]];
var P=JSON.parse(document.getElementById('params').textContent||'{}');
var INVITE=P.invite||'', INV=null, userEdit=null, newLink=null;

/* Sign-in token, kept in this browser only. */
var TOKEN_KEY='gvlab-token';
var TOKEN=(function(){try{return localStorage.getItem(TOKEN_KEY)||'';}catch(e){return '';}})();
function setToken(t){TOKEN=t||'';try{if(t)localStorage.setItem(TOKEN_KEY,t);else localStorage.removeItem(TOKEN_KEY);}catch(e){}}

/* ---------- server calls ---------- */
function busy(on){document.getElementById('busy').className=on?'on':'';}
function toast(msg,bad){var t=document.getElementById('toast');t.textContent=msg;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none';},bad?7000:2500);}
function fail(e){busy(false);toast((e&&e.message)||String(e),true);}
function load(){busy(true);google.script.run.withSuccessHandler(function(st){S=st;busy(false);render();}).withFailureHandler(fail).getState(preview,TOKEN);}
/* Every change sends the sign-in token last, so the server knows who is asking. */
function call(fn,args,okMsg,after){
  busy(true);
  var r=google.script.run.withSuccessHandler(function(res){if(after)after(res);if(okMsg)toast(okMsg);load();}).withFailureHandler(fail);
  r[fn].apply(r,args.concat([TOKEN]));
}
function can(p){return !p||(S.perms||[]).indexOf(p)>=0;}

/* ---------- shared rules (same as the server) ---------- */
function dayset(day){if(day==='Daily')return [0,1,2,3,4,5,6];if(day==='Weekdays')return [1,2,3,4,5];if(day==='Weekends')return [0,6];var i=DAYS.indexOf(day);return i<0?[]:[i];}
function mins(h){var m=String(h||'').match(/^(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null;}
function endMins(h){var m=mins(h);return m===null?1440:(m===1439?1440:m);}
function targets(list,dev){return String(list||'').split(',').map(function(x){return x.trim().toUpperCase();}).filter(String).some(function(u){
  return u==='ALL'||(u==='ALL SIGNAGE'&&dev.profile==='Signage')||(u==='CLASSROOMS'&&dev.profile==='Classroom')||u===String(dev.name).toUpperCase()||u===String(dev.id).toUpperCase();});}
function addDays(ymd,n){var d=new Date(ymd+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function nextDow(ymd,dow){var cur=new Date(ymd+'T12:00:00Z').getUTCDay();return addDays(ymd,(dow-cur+7)%7);}
function niceStamp(t){var p=ymdParts(t.ymd),c=clockParts(t.mins);return p.dow+', '+p.month+' '+p.day+', '+c.t+' '+c.ap;}
function themeColor(name){var t=(S.themeObjs||[]).filter(function(x){return x.name===name;})[0];return t?t.main:'#666';}
function lum(hex){var c=hex.replace('#','');if(c.length===3)c=c.split('').map(function(x){return x+x;}).join('');
  return [0,2,4].map(function(i){var v=parseInt(c.substr(i,2),16)/255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);})
    .reduce(function(s,v,i){return s+v*[0.2126,0.7152,0.0722][i];},0);}
function opts(list,sel){return list.map(function(v){return '<option'+(v===sel?' selected':'')+'>'+esc(v)+'</option>';}).join('');}
function clk(){return {ymd:S.t.ymd,mins:S.t.mins,secs:0};}

/* ---------- layout ---------- */
function render(){
  var who=document.getElementById('who'),nav=document.getElementById('nav'),m=document.getElementById('main');
  if(INVITE){who.innerHTML='';nav.innerHTML='';m.innerHTML=vInvite();return;}
  if(S.state){
    who.innerHTML='';nav.innerHTML='';
    m.innerHTML=S.state==='Setup'?vSetup():S.state==='SignIn'?vSignIn():vNotReady();
    return;
  }
  who.innerHTML='<b>'+esc(S.me.name)+'</b><br>'+esc(S.me.role)+(S.me.role==='Limited'?' · '+esc(S.me.themes.join(', ')):'');
  var allowed=VIEWS.filter(function(v){return can(v[2]);});
  if(!allowed.some(function(v){return v[0]===view;}))view='now';
  nav.innerHTML=allowed.map(function(v){return '<button data-act="view" data-v="'+v[0]+'" class="'+(v[0]===view?'on':'')+'">'+v[1]+'</button>';}).join('');
  m.innerHTML=overrideBanner()+({now:vNow,devices:vDevices,override:vOverride,schedule:vSchedule,themes:vThemes,slides:vSlides,activity:vActivity,launchers:vLaunchers,greenroom:vGreenRoom,people:vPeople,church:vChurch,account:vAccount}[view])();
  fitScreens(m);
}
function overrideBanner(){
  var o=S.override;if(o.Active!=='TRUE'||view==='override')return '';
  return '<div class="panel banner"><div class="row" style="justify-content:space-between"><div><b>Override is on:</b> '+esc(o.Mode)+' on '+esc(o.Devices)+
    (o['Ends At']?', until '+esc(o['Ends At']):', until someone ends it')+'</div>'+(can('override')?'<button class="btn danger" data-act="endOv">End override</button>':'')+'</div></div>';
}

/* ---------- Now ---------- */
function timeBar(){
  var td=S.t.today,ps=[
    ['Sunday 9:45 AM',nextDow(td,0)+'T09:45'],['Sunday 10:45 AM',nextDow(td,0)+'T10:45'],['Wednesday 4:30 PM',nextDow(td,3)+'T16:30'],
    ['Thanksgiving',td.slice(0,4)+'-11-26T10:00'],['Christmas Eve 4 PM',td.slice(0,4)+'-12-24T16:00'],['Saturday 11 PM',nextDow(td,6)+'T23:00']];
  return '<section class="panel"><div class="timebar"><div class="now'+(S.t.preview?' pv':'')+'">'+(S.t.preview?'Previewing ':'Live now: ')+esc(niceStamp(S.t))+'</div>'+
    (S.t.preview?'<button class="btn sm" data-act="at" data-at="">Back to live</button>':'')+'</div>'+
    '<div class="row">'+ps.map(function(p){return '<button class="tog'+(preview===p[1]?' on':'')+'" data-act="at" data-at="'+p[1]+'">'+p[0]+'</button>';}).join('')+'</div>'+
    '<div class="row"><input type="date" id="pvDate" value="'+S.t.ymd+'" style="width:auto"><input type="time" id="pvTime" value="'+String(Math.floor(S.t.mins/60)).padStart(2,'0')+':'+String(S.t.mins%60).padStart(2,'0')+'" style="width:auto">'+
    '<button class="btn sm" data-act="atCustom">Preview this time</button><span class="muted small">Previews don\'t change anything. They show what each TV would show.</span></div></section>';
}
function vNow(){
  var on=S.devices.filter(function(d){return d.now.mode!=='Off';}).length;
  return timeBar()+(pairForm?vPairForm():'')+'<div class="row" style="justify-content:space-between"><div class="muted">'+on+' of '+S.devices.length+' TVs showing something'+(S.conflicts.length?' · <a href="#" data-act="view" data-v="schedule">'+S.conflicts.length+' schedule overlap'+(S.conflicts.length>1?'s':'')+'</a>':'')+'</div>'+(isAdmin()&&!pairForm?'<button class="btn pri" data-act="pairOpen">Pair a TV</button>':'')+'</div>'+
    '<div class="grid">'+S.devices.map(card).join('')+'</div>';
}
function card(d){
  var src=d.now.source==='Special Date'?'Special':d.now.source;
  var link=S.url+'?tv='+encodeURIComponent(d.id)+(S.t.preview?'&at='+encodeURIComponent(preview):'');
  return '<article class="card"><div class="tvbox">'+renderScreen(d.screen,clk(),S.weather,{qr:false})+'</div><div class="cb">'+
    '<div class="ch"><h3>'+esc(d.name)+'</h3><span class="chip '+esc(src)+'">'+esc(d.now.mode)+'</span></div>'+
    '<p class="why">'+esc(d.now.label)+'</p>'+
    '<p class="meta">'+esc(d.screen.theme.name)+' theme · '+esc(d.profile)+'</p>'+
    '<p class="meta"><span class="dot'+(d.pairedAt?' ok':'')+'"></span>'+(d.pairedAt?'Paired '+esc(d.pairedAt)+(d.lastSeen?' · last checked in '+esc(d.lastSeen):''):'No screen paired')+'</p>'+
    '<div class="acts"><a class="btn sm" href="'+esc(link)+'" target="_blank" rel="noopener" title="See what this TV shows. Previews never count as the TV checking in.">Preview</a>'+
    (isAdmin()&&d.pairedAt?(pendingDelete==='tv:'+d.id?'<button class="btn sm danger" data-act="unpairGo" data-id="'+esc(d.id)+'">Confirm unpair</button>':'<button class="btn sm" data-act="unpairAsk" data-id="'+esc(d.id)+'">Unpair</button>'):'')+
    (can('override')?'<button class="btn sm" data-act="ovFor" data-name="'+esc(d.name)+'">Override</button>':'')+'</div></div></article>';
}

/* ---------- Override ---------- */
function ovDefaults(){return {targets:['ALL SIGNAGE'],mode:'Message',theme:(S.themes[0]||{}).Theme||'',message:'',duration:'60'};}
function ovDevices(){return ov.targets.indexOf('ALL')>=0?'ALL':ov.targets.join(', ');}
function ovAffected(){var t=ovDevices();return S.allDevices.filter(function(d){return targets(t,d);});}
function ovPreview(){
  var aff=ovAffected(),base=null;
  for(var i=0;i<S.devices.length&&!base;i++)if(aff.some(function(a){return a.id===S.devices[i].id;}))base=S.devices[i];
  if(!base)return '<p class="muted">Pick a TV to see a preview.</p>';
  var th=S.themeObjs.filter(function(x){return x.name===ov.theme;})[0]||base.screen.theme;
  var scr=JSON.parse(JSON.stringify(base.screen));
  scr.mode=ov.mode;scr.message=ov.message||'Your message shows here.';scr.theme=th;
  scr.slides=S.slidesByTheme[th.name]||[];scr.events=S.eventsByTheme[th.name]||[];
  return '<div class="muted small">Preview on '+esc(base.name)+'</div><div class="tvbox">'+renderScreen(scr,clk(),S.weather,{qr:false})+'</div>';
}
function vOverride(){
  if(!ov)ov=ovDefaults();
  var o=S.override,active=o.Active==='TRUE',h='';
  if(active){
    h+='<section class="panel banner"><h2>Override is on</h2><p>'+esc(o.Mode)+' on <b>'+esc(o.Devices)+'</b> with the '+esc(o.Theme)+' theme'+
      (o.Message?': “'+esc(o.Message)+'”':'')+'</p><p class="muted small">Started by '+esc(o['Started By'])+' at '+esc(o['Started At'])+(o['Ends At']?'. Ends at '+esc(o['Ends At'])+' on its own.':'. Stays on until someone ends it.')+
      '</p><div class="row"><button class="btn pri" data-act="endOv">End override</button></div></section>';
  }
  var chips=['ALL','ALL SIGNAGE','CLASSROOMS'].concat(S.allDevices.map(function(d){return d.name;}));
  var aff=ovAffected();
  h+='<section class="panel"><h2>'+(active?'Replace the override':'Start an override')+'</h2>'+
    '<p class="muted small">An override wins over every schedule until it ends. Virtual TVs pick it up within 15 seconds.</p>'+

function weekGrid(){
  var H=36,START=6,END=23,f=schedFilter==='all'?null:S.allDevices.filter(function(d){return d.id===schedFilter;})[0];
  var hidden={};S.conflicts.forEach(function(c){if(!f||c.devices.indexOf(f.name)>=0)hidden[c.row]=1;});
  var h='<div class="week"><div class="dh"></div>'+DAYS.map(function(d){return '<div class="dh">'+d+'</div>';}).join('');
  h+='<div class="hrs" style="height:'+((END-START)*H)+'px">';
  for(var k=START+1;k<END;k++)h+='<span style="top:'+((k-START)*H)+'px">'+(k%12||12)+(k<12?'a':'p')+'</span>';
  h+='</div>';
  for(var day=0;day<7;day++){
    var items=S.weekly.map(function(r,i){return {r:r,i:i,s:mins(r.Start),e:endMins(r.End)};}).filter(function(x){
      return x.s!==null&&dayset(x.r.Day).indexOf(day)>=0&&(!f||targets(x.r.Devices,f));});
    var lanes=[];items.forEach(function(x){var l=0;while(lanes[l]&&lanes[l]>x.s)l++;lanes[l]=x.e;x.l=l;});
    var n=Math.max(1,lanes.length);
    h+='<div class="col" style="height:'+((END-START)*H)+'px">'+items.map(function(x){
      var top=Math.max(0,(x.s-START*60)/60*H),bot=Math.min((END-START)*H,(x.e-START*60)/60*H);if(bot<=top)return '';
      return '<div class="blk'+(hidden[x.r._row]?' hid':'')+'" data-act="editW" data-i="'+x.i+'" title="Row '+x.r._row+': '+esc(x.r.Devices+' · '+x.r.Mode+' · '+fmtRange(x.r.Start,x.r.End))+'" style="top:'+top+'px;height:'+(bot-top-2)+'px;left:'+(x.l/n*100)+'%;width:calc('+(100/n)+'% - 3px);background:'+esc(safeColor(themeColor(x.r.Theme),'#666'))+';opacity:'+(x.r.Enabled==='TRUE'?1:.4)+'"><b>'+esc(x.r.Mode)+'</b>'+esc(x.r.Devices)+'</div>';
    }).join('')+'</div>';
  }
  return h+'</div>';
}

/* ---------- Calendars: a main calendar plus fallbacks ----------
 * Stored in the theme's Calendar cell as "main; fallback 1; fallback 2". If the main calendar has fewer
 * than 3 events in the next 7 days, the fallbacks top This Week up to 4, in order (same rule as the TV app).
 */
var calCheck=null;
var CAL_MAX=8; // calendars per theme, same cap as the server
function calList(){var v=String(themeForm.Calendar||'');var l=v.split(/;|\n/).map(function(x){return x.trim();}).slice(0,CAL_MAX);return v.trim()?l:[''];}
function calSet(list){themeForm.Calendar=list.map(function(x){return x.trim();}).filter(function(x,i){return x||i===0;}).join('; ');}
function calSaved(){return (S.themes.filter(function(t){return t.Theme===themeForm.Theme;})[0]||{}).Calendar||'';}
/* Status for the calendars as written now: a fresh Check-all result, or the saved status if unchanged. */
function calResult(){
  if(calCheck&&calCheck.theme===themeForm.Theme&&calCheck.text===String(themeForm.Calendar||''))return calCheck.result;
  if(String(themeForm.Calendar||'')===calSaved())return (S.calStatus||{})[themeForm.Theme]||null;
  return null;
}
function calChip(src){
  if(!src)return '';
  if(src.state==='loaded')return '<span class="chip '+(src.used?'ok':'')+'">'+src.count+' event'+(src.count===1?'':'s')+(src.used?' · in use':' · not needed')+'</span>';
  if(src.state==='unused')return '<span class="chip">Not needed this week</span>';
  if(src.state==='invalid')return '<span class="chip bad">Not a calendar link</span>';
  return '<span class="chip bad">Can’t read it</span>';
}
function calEditor(){
  var list=calList(),r=calResult(),srcs=(r&&r.sources)||[];
  var rows=list.map(function(v,i){
    var st=v?srcs.filter(function(x){return x.url===v;})[0]||null:null;
    return '<div class="calRow"><div class="small" style="font-weight:600">'+(i===0?'Main calendar':'Fallback '+i)+'</div>'+
      '<div class="row" style="flex-wrap:nowrap"><input type="text" id="calSrc'+i+'" data-calsrc="'+i+'" value="'+esc(v)+'" placeholder="webcal://… or https://….ics or a Google Calendar ID" spellcheck="false" style="flex:1;min-width:0">'+
      (list.length>1?'<button class="btn sm" data-act="calMove" data-i="'+i+'" data-d="-1" aria-label="Move up"'+(i===0?' disabled':'')+'>↑</button>'+
        '<button class="btn sm" data-act="calMove" data-i="'+i+'" data-d="1" aria-label="Move down"'+(i===list.length-1?' disabled':'')+'>↓</button>'+
        '<button class="btn sm danger" data-act="calRemove" data-i="'+i+'">Remove</button>':'')+'</div>'+
      '<div class="small" id="calStat'+i+'">'+calChip(st)+(st&&st.error?' <span class="muted">'+esc(st.error)+'</span>':'')+'</div></div>';
  }).join('');
  return '<div class="cpair"><div class="cpair-h"><b>Calendars for This Week</b><button class="btn sm" data-act="calCheckAll">Check all calendars</button></div>'+
    '<p class="small muted" style="margin:0">This Week shows the main calendar. If it has fewer than 3 events in the next 7 days, the fallbacks fill the list up to 4, in order, each event once. Fallbacks are only read when needed.</p>'+
    rows+'<div><button class="btn sm" data-act="calAdd">+ Add a fallback calendar</button></div></div>';
}
function calNote(){
  var saved=calSaved(),r=calResult(),h='';

/* Uploads one file at a time, so each lands in order and one bad file doesn't stop the rest. */
function uploadFiles(files){
  files=Array.prototype.slice.call(files||[]);
  if(!files.length)return;
  var ok=['image/jpeg','image/png','video/mp4'],from=val('upFrom'),until=val('upUntil'),done=0,failed=[];
  var status=function(msg){var e=document.getElementById('upStatus');if(e)e.textContent=msg;};
  function next(){
    if(!files.length){
      busy(false);
      toast(done+' file'+(done===1?'':'s')+' uploaded'+(failed.length?', '+failed.length+' failed':''),!!failed.length);
      if(failed.length)status(failed.join(' '));
      load();return;
    }
    var f=files.shift();
    if(ok.indexOf(f.type)<0){failed.push('"'+f.name+'" isn\'t a JPG, PNG or MP4.');next();return;}
    if(f.size>45*1024*1024){failed.push('"'+f.name+'" is over 45 MB; put it straight into the Drive folder.');next();return;}
    status('Uploading '+f.name+'…');busy(true);
    var r=new FileReader();
    r.onload=function(){
      var b64=String(r.result).split(',')[1]||'';
      google.script.run.withSuccessHandler(function(){done++;next();})
        .withFailureHandler(function(e){failed.push((e&&e.message)||String(e));next();})
        .uploadSlide(slideTheme,f.name,f.type,b64,from,until,TOKEN);
    };
    r.onerror=function(){failed.push('"'+f.name+'" couldn\'t be read.');next();};
    r.readAsDataURL(f);
  }
  next();
}

function onField(e){
  var el=e.target.closest('[data-f]');if(!el||!S)return;var k=el.dataset.f;
  if(k==='schedFilter'){schedFilter=el.value;render();return;}
  if(k==='pair.target'){pairForm={code:val('pairCode'),target:el.value,name:val('pairName'),profile:val('pairProfile'),theme:val('pairTheme')};render();return;}
  if(k==='ue.role'){userEdit.email=val('ueEmail');userEdit.name=val('ueName');userEdit.role=el.value;render();return;}
  if(k.indexOf('ov.')===0){ov[k.slice(3)]=el.value;ovConfirm=false;
    if(k==='ov.message'&&e.type==='input'){var p=document.getElementById('ovPrev');if(p){p.innerHTML=ovPreview();fitScreens(p);}}
    else if(e.type==='change')render();return;}
  if(k.indexOf('th.')===0){var f=k.slice(3);themeForm[f]=el.value;
    var inRow=el.parentNode&&el.parentNode.classList.contains('colorrow');
    if(inRow&&el.type==='color'){themeForm[f]=el.value.toUpperCase();var tx=el.parentNode.querySelector('input[type=text]');if(tx)tx.value=themeForm[f];}
    if(inRow&&el.type==='text'&&isHex(el.value)){var c=el.parentNode.querySelector('input[type=color]');if(c)c.value=el.value;}
    refreshThemePreview();}
}
