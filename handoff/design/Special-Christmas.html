<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Christmas Eve countdown</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&amp;family=Source+Sans+3:wght@300;400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#F4D35E}
</style>
<div style="width: 1920px; height: 1080px; display: flex; flex-direction: column; overflow: hidden; background: #1F5C3A; color: #FFFFFF; font-family: 'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <div style="height: 856px; box-sizing: border-box; padding: 100px 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; background: #173F29">
    <svg viewBox="0 0 48 48" width="96" height="96" aria-hidden="true" fill="none" stroke="#F2D27A" stroke-width="2.5" stroke-linejoin="round"><path d="M24 4l5.5 13H43l-11 8.5 4.5 14L24 31l-12.5 8.5 4.5-14L5 17h13.5z"></path></svg>
    <h1 style="margin: 0; font-family: Montserrat, Arial, sans-serif; font-weight: 800; font-size: 140px; line-height: 1.02">Christmas Eve Service</h1>
    <p style="margin: 10px 0 0; font-size: 60px; font-weight: 600; color: #F2D27A">Thursday, December 24 · 4:00 PM</p>
    <p style="margin: 0; font-size: 44px">[Service details from the Christmas folder]</p>
  </div>
  <div style="height: 224px; box-sizing: border-box; padding: 0 140px; display: flex; align-items: center; justify-content: space-between; background: #A61C28">
    <div style="display: flex; align-items: baseline; gap: 36px">
      <span style="font-size: 52px; font-weight: 600">Service begins in</span>
      <span style="font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: 150px; line-height: 1; font-variant-numeric: tabular-nums">24:15</span>
    </div>
    <img src="../assets/logo-church-white.png" alt="Graceview Baptist Church" style="display: block; width: 300px; height: auto">
  </div>
</div>
</body>
</html>
