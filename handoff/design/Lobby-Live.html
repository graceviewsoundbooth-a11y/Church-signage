<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby live feed</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;family=Source+Sans+3:wght@300;400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#F4D35E}
</style>
<div style="width: 1920px; height: 1080px; display: flex; flex-direction: column; overflow: hidden; background: #0B0C0F; color: #FFFFFF; font-family: 'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <div style="height: 940px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: #16181D">
    <svg viewBox="0 0 120 80" width="180" height="120" aria-hidden="true" fill="none" stroke="#8A8F9C" stroke-width="3" stroke-linejoin="round"><rect x="4" y="4" width="112" height="72" rx="6"></rect><path d="M50 26l26 14-26 14z"></path></svg>
    <span style="font-size: 44px; color: #B8BCC6">[Live video from the sanctuary]</span>
  </div>
  <div style="height: 140px; box-sizing: border-box; padding: 0 72px; display: flex; align-items: center; justify-content: space-between; background: #B50606">
    <div style="display: flex; align-items: center; gap: 28px">
      <span style="display: flex; align-items: center; gap: 12px; padding: 10px 22px; border-radius: 8px; background: #FFFFFF; color: #B50606; font-family: Montserrat, Arial, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 0.08em"><span style="width: 16px; height: 16px; border-radius: 8px; background: #B50606"></span>LIVE</span>
      <span style="font-size: 44px; font-weight: 600">Sunday Worship from the Sanctuary</span>
    </div>
    <div style="display: flex; align-items: center; gap: 36px">
      <span style="font-size: 52px; font-weight: 300">10:52 AM</span>
      <img src="../assets/logo-church-white.png" alt="Graceview Baptist Church" style="display: block; width: 230px; height: auto">
    </div>
  </div>
</div>
</body>
</html>
