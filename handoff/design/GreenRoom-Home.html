<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Green Room home screen</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;family=Source+Sans+3:wght@300;400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#F4D35E}
</style>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #1D3557; color: #FFFFFF; font-family: 'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <img src="../assets/slide-psalms.jpg" alt="Announcement: Worshipping God in the Psalms, Thursdays at 6:30 PM" style="position: absolute; top: 0; left: 0; display: block; width: 1920px; height: 1080px; object-fit: cover">
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 120px; box-sizing: border-box; padding: 0 72px; display: flex; align-items: center; justify-content: space-between; background: #B50606">
    <div style="display: flex; align-items: center; gap: 24px">
      <img src="../assets/logo-church-white.png" alt="Graceview Baptist Church" style="display: block; width: 210px; height: auto">
      <span style="padding-left: 24px; border-left: 2px solid rgba(255,255,255,0.6); font-size: 34px; font-weight: 600">Green Room</span>
    </div>
    <div style="display: flex; align-items: center; gap: 40px; font-size: 40px; font-weight: 300">
      <span>Sun, Nov 8</span>
      <span style="font-weight: 400">9:18 AM</span>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 340px; box-sizing: border-box; padding: 34px 72px 48px; display: flex; flex-direction: column; gap: 20px; background: rgba(8,12,20,0.88)">
    <span style="font-size: 28px; font-weight: 600; letter-spacing: 0.06em">Apps</span>
    <div style="display: flex; gap: 24px">
      <button type="button" style="width: 400px; height: 196px; box-sizing: border-box; padding: 0 30px; display: flex; align-items: center; gap: 24px; border: 0; border-radius: 20px; outline: 6px solid #FFFFFF; outline-offset: 4px; background: #B50606; color: #FFFFFF; text-align: left; font: 600 30px 'Source Sans 3', Arial, sans-serif">
        <svg viewBox="0 0 48 48" width="72" height="72" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"><rect x="4" y="6" width="22" height="16" rx="2"></rect><rect x="30" y="6" width="14" height="36" rx="2"></rect><rect x="4" y="26" width="22" height="16" rx="2"></rect></svg>
        <span style="display: flex; flex-direction: column; gap: 4px"><span>Green Room Dashboard</span><span style="font-size: 22px; font-weight: 400">Mics, order of service, band, live feed</span></span>
      </button>
      <button type="button" style="position: relative; width: 196px; height: 196px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; border: 0; border-radius: 20px; background: #2C3442; color: #FFFFFF; font: 600 28px 'Source Sans 3', Arial, sans-serif">
        <svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"><circle cx="24" cy="24" r="5"></circle><path d="M14 14a14 14 0 0 0 0 20M34 14a14 14 0 0 1 0 20M8 8a22 22 0 0 0 0 32M40 8a22 22 0 0 1 0 32"></path></svg>
        Watch Live
      </button>
      <button type="button" style="width: 196px; height: 196px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; border: 0; border-radius: 20px; background: #2C3442; color: #FFFFFF; font: 600 28px 'Source Sans 3', Arial, sans-serif">
        <svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"><rect x="5" y="9" width="38" height="26" rx="3"></rect><path d="M16 42h16M24 35v7M12 18h16M12 25h10"></path></svg>
        Announcements
      </button>
      <button type="button" style="width: 196px; height: 196px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; border: 0; border-radius: 20px; background: #2C3442; color: #FFFFFF; font: 600 28px 'Source Sans 3', Arial, sans-serif">
        <svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 32V10h36v26H26"></path><path d="M6 38h2M6 32a8 8 0 0 1 8 8M6 25a15 15 0 0 1 15 15"></path></svg>
        Screen Mirror
      </button>
      <button type="button" style="width: 196px; height: 196px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; border: 0; border-radius: 20px; background: #2C3442; color: #FFFFFF; font: 600 28px 'Source Sans 3', Arial, sans-serif">
        <svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"><path d="M8 16h32v10l-5 6H13l-5-6z"></path><path d="M16 32v8M32 32v8"></path></svg>
        HDMI Input
      </button>
      <button type="button" style="width: 196px; height: 196px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; border: 0; border-radius: 20px; background: #2C3442; color: #FFFFFF; font: 600 28px 'Source Sans 3', Arial, sans-serif">
        <svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" fill="#FFFFFF"><circle cx="12" cy="12" r="4"></circle><circle cx="24" cy="12" r="4"></circle><circle cx="36" cy="12" r="4"></circle><circle cx="12" cy="24" r="4"></circle><circle cx="24" cy="24" r="4"></circle><circle cx="36" cy="24" r="4"></circle><circle cx="12" cy="36" r="4"></circle><circle cx="24" cy="36" r="4"></circle><circle cx="36" cy="36" r="4"></circle></svg>
        All Apps
      </button>
      <button type="button" style="width: 196px; height: 196px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; border: 0; border-radius: 20px; background: #2C3442; color: #FFFFFF; font: 600 28px 'Source Sans 3', Arial, sans-serif">
        <svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"><circle cx="24" cy="24" r="7"></circle><path d="M24 4v7M24 37v7M4 24h7M37 24h7M10 10l5 5M33 33l5 5M38 10l-5 5M15 33l-5 5"></path></svg>
        Settings
      </button>
    </div>
  </div>
</div>
</body>
</html>
