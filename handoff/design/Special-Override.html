<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Override Now weather message</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&amp;family=Source+Sans+3:wght@300;400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#F4D35E}
</style>
<div style="width: 1920px; height: 1080px; display: flex; flex-direction: column; overflow: hidden; background: #14171C; color: #FFFFFF; font-family: 'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <div style="height: 28px; background: #F2A900"></div>
  <div style="flex: 1 1 0; box-sizing: border-box; padding: 100px 160px; display: flex; flex-direction: column; justify-content: center; gap: 40px">
    <div style="display: flex; align-items: center; gap: 24px">
      <svg viewBox="0 0 48 48" width="84" height="84" aria-hidden="true" fill="none" stroke="#F2A900" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M24 5L44 41H4z"></path><path d="M24 19v10M24 35v1"></path></svg>
      <span style="font-family: Montserrat, Arial, sans-serif; font-weight: 800; font-size: 48px; letter-spacing: 0.08em; color: #F2A900">WEATHER UPDATE</span>
    </div>
    <h1 style="margin: 0; font-family: Montserrat, Arial, sans-serif; font-weight: 800; font-size: 120px; line-height: 1.08">Due to weather, all activities today are canceled.</h1>
    <p style="margin: 0; font-size: 50px; color: #D6D9DF">Watch graceview.org and your email for updates.</p>
  </div>
  <div style="height: 150px; box-sizing: border-box; padding: 0 160px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #2E333C">
    <img src="../assets/logo-church-white.png" alt="Graceview Baptist Church" style="display: block; width: 240px; height: auto">
    <span style="font-size: 48px; font-weight: 300">7:18 AM</span>
  </div>
</div>
</body>
</html>
