<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Front Office renter hours</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&amp;family=Source+Sans+3:wght@300;400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#BFE3EA}
</style>
<div style="width: 1920px; height: 1080px; display: flex; flex-direction: column; overflow: hidden; background: #2E3238; color: #FFFFFF; font-family: 'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <div style="position: relative; height: 864px; box-sizing: border-box; padding: 100px 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; background: #3A4048">
    <div style="padding: 18px 34px; border: 3px dashed #9AA3AE; border-radius: 12px; font-size: 40px; color: #D5DAE0">[Announcement from the Renter folder]</div>
    <h1 style="margin: 0; font-family: Montserrat, Arial, sans-serif; font-weight: 800; font-size: 120px; line-height: 1.05">[Renter headline]</h1>
    <p style="margin: 0; font-size: 56px; font-weight: 600">[Details, date and time]</p>
    <div style="position: absolute; left: 0; right: 0; bottom: 36px; display: flex; justify-content: center; gap: 14px" aria-hidden="true">
      <span style="width: 14px; height: 14px; border-radius: 7px; background: rgba(255,255,255,0.4)"></span>
      <span style="width: 40px; height: 14px; border-radius: 7px; background: #FFFFFF"></span>
      <span style="width: 14px; height: 14px; border-radius: 7px; background: rgba(255,255,255,0.4)"></span>
    </div>
  </div>
  <div style="display: flex; height: 216px">
    <div style="width: 384px; display: flex; align-items: center; justify-content: center; gap: 14px; background: #1E2126">
      <span style="font-size: 120px; font-weight: 300; line-height: 1">1:30</span>
      <span style="font-size: 44px; font-weight: 300; margin-top: 24px">PM</span>
    </div>
    <div style="width: 384px; display: flex; align-items: center; justify-content: center; gap: 20px; background: #2E3238">
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <span style="font-size: 76px; font-weight: 300; line-height: 1">Wed</span>
        <span style="font-size: 30px">November</span>
      </div>
      <span style="font-size: 120px; font-weight: 300; line-height: 1">04</span>
    </div>
    <div style="width: 384px; display: flex; align-items: center; justify-content: center; background: #22617A">
      <div style="padding: 20px 28px; border: 3px dashed rgba(255,255,255,0.75); border-radius: 12px; font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: 36px">[Renter logo]</div>
    </div>
    <div style="width: 384px; display: flex; align-items: center; justify-content: center; gap: 18px; background: #1E2126">
      <img src="../assets/qr-wifi.png" alt="QR code to join the guest Wi-Fi" style="display: block; width: 150px; height: 150px; padding: 6px; background: #FFFFFF">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 30px; font-weight: 600">Free Wi-Fi</span>
        <span style="font-size: 22px">Scan to join</span>
      </div>
    </div>
    <div style="width: 384px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #2E3238">
      <div style="display: flex; align-items: center; gap: 16px">
        <svg viewBox="0 0 64 44" width="100" height="70" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"><path d="M17 40h31a11 11 0 0 0 1-22 16 16 0 0 0-30-5A13.5 13.5 0 0 0 17 40z"></path></svg>
        <span style="font-size: 100px; font-weight: 300; line-height: 1">75°</span>
      </div>
      <span style="font-size: 26px">Tomball</span>
    </div>
  </div>
</div>
</body>
</html>
