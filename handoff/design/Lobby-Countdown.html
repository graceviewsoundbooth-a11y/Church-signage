<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby Sunday countdown</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;family=Source+Sans+3:wght@300;400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#F4D35E}
</style>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <img src="../assets/slide-prayer.jpg" alt="Announcement: Need prayer? Send prayer requests to graceview.org/grow/prayer" style="display: block; width: 1920px; height: 1080px; object-fit: cover">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 200px; box-sizing: border-box; padding: 0 96px; display: flex; align-items: center; justify-content: space-between; background: #B50606">
    <div style="display: flex; align-items: baseline; gap: 32px">
      <span style="font-size: 48px; font-weight: 600">Worship begins in</span>
      <span style="font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: 136px; line-height: 1; font-variant-numeric: tabular-nums">18:42</span>
    </div>
    <div style="display: flex; align-items: center; gap: 36px">
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
        <span style="font-size: 42px; font-weight: 600">Sanctuary · 10:30 AM</span>
        <span style="font-size: 30px">Sunday, November 8</span>
      </div>
      <img src="../assets/logo-church-white.png" alt="Graceview Baptist Church" style="display: block; width: 280px; height: auto">
    </div>
  </div>
</div>
</body>
</html>
